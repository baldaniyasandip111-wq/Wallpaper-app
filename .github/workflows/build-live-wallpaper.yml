name: Build Android Live Wallpaper

on:
  push:
    branches: [main]
    paths:
      - "android-live-wallpaper/**"
      - ".github/workflows/build-live-wallpaper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-live-wallpaper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-app-live-debug
          path: android-live-wallpaper/app/build/outputs/apk/debug/app-debug.apk

# Manual verification trigger checkpoint
